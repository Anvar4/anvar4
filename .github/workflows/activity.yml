name: Update GitHub activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the activity panel
        env:
          # Add a STATS_TOKEN secret (classic token with "repo" and "read:user")
          # to include private repositories. Public data works without it.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/activity.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet || git commit -m "Update GitHub activity panel"
          git push
